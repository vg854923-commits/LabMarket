{% extends 'base.html' %}{% block content %}<section class="section"><div class="section-heading"><p class="eyebrow">CUSTOMER FEEDBACK</p><h1>Share your experience</h1></div><div class="checkout-layout"><form class="checkout-form" method="post"><label>Equipment<select name="product_id" required>{% for p in products %}<option value="{{p['id']}}">{{p['name']}}</option>{% endfor %}</select></label><label>Rating<select name="rating" required><option value="5">5 - Excellent</option><option value="4">4 - Very Good</option><option value="3">3 - Good</option><option value="2">2 - Fair</option><option value="1">1 - Poor</option></select></label><label>Comment<textarea name="comment" required></textarea></label><button class="btn">Submit Feedback</button></form><div class="feedback-grid" style="grid-template-columns:1fr">{% for f in feedbacks %}<article class="feedback-card"><div class="stars">{{'★'*f['rating']}}{{'☆'*(5-f['rating'])}}</div><p>“{{f['comment']}}”</p><strong>{{f['name']}}</strong><small>{{f['product_name']}}</small></article>{% endfor %}</div></div></section>{% endblock %}
