{% extends 'base.html' %}{% block content %}<section class="section auth-section"><div class="auth-card"><p class="eyebrow">LABMARKET ACCOUNT</p><h1>Create Account</h1><form method="post"><label>Full Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="btn" type="submit">Sign Up</button><label>📞 Contact Number<input name="phone" type="tel" required placeholder="10-digit contact number"></label><label>🏠 Address<textarea name="address" rows="3" required placeholder="Enter address"></textarea></label></form><p class="auth-link">Already registered? <a href="{{url_for('login')}}">Login</a></p></div></section>{% endblock %}
